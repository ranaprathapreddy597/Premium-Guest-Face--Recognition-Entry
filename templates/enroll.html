<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #05070A;
            --surface: rgba(13, 17, 32, 0.4);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #6C63FF;
            --text: #E2E8F0;
            --muted: #94A3B8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Outfit', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Subtle animated gradient background */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at center, rgba(108, 99, 255, 0.08) 0%, transparent 40%);
            animation: rotateBg 30s linear infinite;
            z-index: -1;
        }

        @keyframes rotateBg {
            100% {
                transform: rotate(360deg);
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 30px;
            width: 100%;
            max-width: 550px;
            backdrop-filter: blur(30px);
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
        }

        .logo-icon {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #6C63FF, #3B82F6);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 1.5rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--muted);
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .camera-box {
            width: 100%;
            height: 320px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8);
        }

        video,
        img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #6C63FF, #3B82F6);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.05rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 15px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(108, 99, 255, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--muted);
        }

        .btn-ghost {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            color: var(--text);
            backdrop-filter: blur(10px);
        }

        .btn-ghost:hover {
            background: rgba(255, 255, 255, 0.08);
            box-shadow: none;
        }

        .form-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 500;
        }

        input,
        select {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: white;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 0 4px rgba(108, 99, 255, 0.1);
        }
    </style>
</head>

<body>

    <div class="card" id="enrollCard">
        <div class="logo-icon">✨</div>
        <h1>Quick Registration</h1>
        <p>Set up your smart lounge profile in seconds.</p>

        <div class="camera-box">
            <video id="video" autoplay playsinline></video>
            <img id="preview" style="display:none;">
        </div>

        <button class="btn btn-ghost" id="btnSnap" onclick="takeSnapshot()"
            style="margin-top:0; margin-bottom:15px; display:block;">📸 Capture Reference Photo</button>
        <button class="btn btn-ghost" id="btnRetake" onclick="retakePhoto()"
            style="margin-top:0; margin-bottom:15px; display:none;">↺ Retake Photo</button>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div class="form-group"><label>Full Name</label><input type="text" id="eName" placeholder="e.g. Maya Patel">
            </div>
            <div class="form-group"><label>Email Address</label><input type="email" id="eEmail"
                    placeholder="maya@example.com"></div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div class="form-group"><label>Airline</label><input type="text" id="eAirline" placeholder="Emirates">
            </div>
            <div class="form-group"><label>Freq Flyer</label><input type="text" id="eFF" placeholder="EK-123456">
            </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
            <div class="form-group"><label>Welcome Drink</label><input type="text" id="eDrink"
                    placeholder="Matcha Latte">
            </div>
            <div class="form-group"><label>Seat Pref</label>
                <select id="eSeat">
                    <option>Window</option>
                    <option>Aisle</option>
                    <option>Any</option>
                </select>
            </div>
        </div>

        <div style="display:flex; align-items:flex-start; margin-top:10px; margin-bottom:20px; gap:10px;">
            <input type="checkbox" id="eConsent"
                style="width:20px; height:20px; margin-top:2px; accent-color:var(--accent); cursor:pointer;"
                onchange="checkSubmitState()">
            <label for="eConsent"
                style="text-transform:none; font-size:0.85rem; letter-spacing:0; color:var(--text); line-height:1.4;">
                <strong style="color:var(--accent)">DPDP Act 2023 Consent:</strong> I explicitly consent to the
                collection of my biometric template for lounge access. I understand that my raw photo is instantly
                deleted after vector extraction.
            </label>
        </div>

        <button class="btn" id="btnSubmit" onclick="submitEnrollment()" disabled>Complete Registration</button>
    </div>

    <div class="card" id="successCard" style="display:none; text-align:center;">
        <div
            style="font-size:4rem; margin-bottom:20px; filter:drop-shadow(0 0 20px rgba(16,185,129,0.3)); transform:scale(1.2);">
            ✨</div>
        <h1>Registration Complete</h1>
        <p>Your profile is safely stored. A manager will verify your details shortly.</p>
        <p style="color:var(--accent); font-size:0.8rem; margin-top:20px; letter-spacing:1px; font-weight:600;">
            REFERENCE ID: <span id="refId"></span></p>
        <button class="btn btn-ghost" onclick="location.reload()" style="margin-top:40px;">Register Another
            Guest</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const preview = document.getElementById('preview');
        let b64Image = null;

        navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } }).then(s => {
            video.srcObject = s;
            video.onloadedmetadata = () => { canvas.width = video.videoWidth; canvas.height = video.videoHeight; }
        });

        function takeSnapshot() {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            b64Image = canvas.toDataURL('image/jpeg', 0.9);
            video.style.display = 'none';
            preview.src = b64Image;
            preview.style.display = 'block';
            document.getElementById('btnSnap').style.display = 'none';
            document.getElementById('btnRetake').style.display = 'block';
            checkSubmitState();
        }

        function retakePhoto() {
            b64Image = null;
            preview.style.display = 'none';
            video.style.display = 'block';
            document.getElementById('btnRetake').style.display = 'none';
            document.getElementById('btnSnap').style.display = 'block';
            checkSubmitState();
        }

        function checkSubmitState() {
            const btn = document.getElementById('btnSubmit');
            const consent = document.getElementById('eConsent').checked;
            if (b64Image && consent) {
                btn.disabled = false;
                btn.style.opacity = '1';
            } else {
                btn.disabled = true;
                btn.style.opacity = '0.5';
            }
        }

        async function submitEnrollment() {
            const name = document.getElementById('eName').value;
            const email = document.getElementById('eEmail').value;
            const consent = document.getElementById('eConsent').checked;

            if (!name || !email || !b64Image) return alert("Photo, Name, and Email are required.");
            if (!consent) return alert("You must agree to the DPDP privacy policy.");

            const btn = document.getElementById('btnSubmit');
            btn.innerText = "Processing..."; btn.disabled = true;

            try {
                const res = await fetch('/api/enroll', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: name,
                        email: email,
                        airline: document.getElementById('eAirline').value,
                        ff: document.getElementById('eFF').value,
                        drink: document.getElementById('eDrink').value,
                        seat: document.getElementById('eSeat').value,
                        image_b64: b64Image
                    })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('enrollCard').style.display = 'none';
                    document.getElementById('successCard').style.display = 'block';
                    document.getElementById('refId').innerText = Math.random().toString(36).substr(2, 9).toUpperCase();
                } else {
                    alert(data.message);
                    retakePhoto();
                }
            } catch (e) { alert("Network Error."); }

            btn.innerText = "Complete Registration"; btn.disabled = false;
        }
    </script>
</body>

</html>
